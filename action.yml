name: 'SchemaFlow Migration Safety'
description: 'Zero-Knowledge Database Migration Risk, Breaking Change, Linter & Expand-Contract Detector for .NET & EF Core Teams.'
author: 'SchemaFlow Team'

branding:
  icon: 'shield'
  color: 'orange'

inputs:
  input:
    description: 'Ayrıştırılacak migration veya şema dosyasının yolu (.cs, .sql, .prisma).'
    required: true
    default: './Migrations'
  
  output:
    description: 'Güvenlik raporunun kaydedileceği dosya yolu (örn: ./reports/migration_safety.md).'
    required: false
    default: './reports/migration_safety.md'

  fail-on-breaking:
    description: 'Kritik canlı sistem riski veya veri kaybı tespit edildiğinde hata koduyla (exit code 1) sonlansın mı?'
    required: false
    default: 'true'

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - 'lint'
    - '--input'
    - ${{ inputs.input }}
    - '--output'
    - ${{ inputs.output }}
    - ${{ inputs['fail-on-breaking'] == 'true' && '--fail-on-errors' || '' }}
