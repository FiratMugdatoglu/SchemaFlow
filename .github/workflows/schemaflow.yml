name: 'SchemaFlow Migration Safety CI'

# Veritabanı ve migration dosyalarında değişiklik içeren Pull Request'lerde tetiklenir
on:
  pull_request:
    paths:
      - '**/Migrations/**'
      - '**/*.sql'
      - '**/*.prisma'
      - '**/*.py'
      - '**/*.rb'

permissions:
  contents: read
  pull-requests: write # PR altına otomatik güvenlik ve risk yorumu atabilmek için

jobs:
  migration-safety:
    name: '🛡️ Migration Risk & Breaking Change Dedektörü'
    runs-on: ubuntu-latest

    steps:
      - name: 'Kodu Klonla'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Base branch (main) ile karşılaştırmak için tam geçmiş

      - name: '.NET Ortamını Hazırla'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 'SchemaFlow CLI Kurulumu'
        run: dotnet tool install -g SchemaFlow

      - name: '1. Şema Sağlık & Anti-Pattern Denetimi (Lint)'
        continue-on-error: true
        run: |
          schemaflow lint -i faulty_schema.sql -o lint_report.md

      - name: '2. Breaking Change & Risk Analizi (Diff)'
        id: diff_check
        continue-on-error: true
        run: |
          schemaflow diff -b v1_schema.sql -t v2_schema.sql -o diff_report.md --fail-on-breaking

      - name: '3. PR Altına Otomatik Güvenlik Raporu Bırak'
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🛡️ SchemaFlow.ai Migration Güvenlik Denetimi\n\n';
            comment += '> Bu Pull Request veritabanı şemasını değiştiriyor. Canlı ortam riskleri otomatik analiz edildi:\n\n';

            if (fs.existsSync('diff_report.md')) {
              comment += fs.readFileSync('diff_report.md', 'utf8') + '\n\n';
            }

            if (fs.existsSync('lint_report.md')) {
              comment += '---\n\n' + fs.readFileSync('lint_report.md', 'utf8');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
